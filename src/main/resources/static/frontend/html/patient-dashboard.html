<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard - MediConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">MediConnect</a>
            <div class="d-flex align-items-center">
                <a href="find-doctors.html" class="btn btn-outline-light btn-sm me-2">Find Doctor</a>
                <a href="my-appointments.html" class="btn btn-outline-light btn-sm me-2">Appointments</a>
                <a href="notifications.html" class="btn btn-outline-light btn-sm me-2">Notifications</a>
                <a href="#" class="btn btn-light btn-sm" onclick="logout()">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h2>Welcome, <span id="userName"></span>!</h2>
        <p class="text-muted">Patient Dashboard</p>

        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="stat-card text-center">
                    <h3 id="upcomingCount">0</h3>
                    <p class="mb-0">Upcoming Appointments</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card text-center">
                    <h3 id="completedCount">0</h3>
                    <p class="mb-0">Completed</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card text-center">
                    <h3 id="recordCount">0</h3>
                    <p class="mb-0">Medical Records</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card text-center">
                    <h3 id="notifCount">0</h3>
                    <p class="mb-0">Unread Notifications</p>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">Upcoming Appointments</div>
                    <div class="card-body">
                        <div id="upcomingAppointments">Loading...</div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">Recent Notifications</div>
                    <div class="card-body">
                        <div id="recentNotifications">Loading...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4 mt-3">
            <div class="col-md-4">
                <a href="find-doctors.html" class="btn btn-primary w-100">🔍 Find Doctor</a>
            </div>
            <div class="col-md-4">
                <a href="my-appointments.html" class="btn btn-success w-100">📅 My Appointments</a>
            </div>
            <div class="col-md-4">
                <a href="medical-records.html" class="btn btn-info w-100">📋 Medical Records</a>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        const userId = sessionStorage.getItem('user_id');
        if (!userId) window.location.href = 'login.html';

        async function loadDashboard() {
            try {
                const profile = await api.getProfile(userId);
                document.getElementById('userName').textContent = profile.firstName + ' ' + profile.lastName;

                const appointments = await api.getAppointmentsByPatient(userId);
                const upcoming = appointments.filter(a => ['PENDING','CONFIRMED'].includes(a.status));
                const completed = appointments.filter(a => a.status === 'COMPLETED');
                document.getElementById('upcomingCount').textContent = upcoming.length;
                document.getElementById('completedCount').textContent = completed.length;

                const container = document.getElementById('upcomingAppointments');
                if (upcoming.length === 0) {
                    container.innerHTML = '<p class="text-muted">No upcoming appointments</p>';
                } else {
                    container.innerHTML = upcoming.slice(0, 5).map(a => `
                        <div class="border-bottom pb-2 mb-2">
                            <strong>Dr. ${a.doctorName}</strong><br>
                            <small>${a.appointmentDate} at ${a.appointmentTime}</small><br>
                            <span class="badge bg-${a.status === 'CONFIRMED' ? 'success' : 'warning'}">${a.status}</span>
                        </div>
                    `).join('');
                }

                const notifs = await api.getNotifications(userId);
                const unread = notifs.filter(n => !n.read);
                document.getElementById('notifCount').textContent = unread.length;
                const notifContainer = document.getElementById('recentNotifications');
                if (notifs.length === 0) {
                    notifContainer.innerHTML = '<p class="text-muted">No notifications</p>';
                } else {
                    notifContainer.innerHTML = notifs.slice(0, 5).map(n => `
                        <div class="border-bottom pb-2 mb-2 ${n.read ? 'notification-read' : 'notification-unread'}">
                            <strong>${n.title}</strong><br>
                            <small>${n.message}</small>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error(err);
            }
        }
        loadDashboard();
        function logout() { api.clearToken(); window.location.href = 'index.html'; }
    </script>
</body>
</html>
