<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MediConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container"><a class="navbar-brand" href="index.html">MediConnect</a></div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4">Login</h3>
                        <div id="alertBox" class="alert d-none"></div>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="password" required>
                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePass()">👁</button>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="submitBtn">Login</button>
                        </form>
                        <p class="text-center mt-3">Don't have an account? <a href="register.html">Register</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        function togglePass() {
            const p = document.getElementById('password');
            p.type = p.type === 'password' ? 'text' : 'password';
        }
        function showAlert(msg, type) {
            const box = document.getElementById('alertBox');
            box.className = `alert alert-${type}`;
            box.textContent = msg;
            box.classList.remove('d-none');
        }
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.textContent = 'Logging in...';
            try {
                const data = await api.login({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                });
                api.setToken(data.token);
                sessionStorage.setItem('user_role', data.role);
                sessionStorage.setItem('user_id', data.userId);
                if (data.role === 'ROLE_ADMIN') window.location.href = 'admin-dashboard.html';
                else if (data.role === 'ROLE_DOCTOR') window.location.href = 'doctor-dashboard.html';
                else window.location.href = 'patient-dashboard.html';
            } catch (err) {
                showAlert(err.data?.message || 'Login failed', 'danger');
                btn.disabled = false; btn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
