<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - MediConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">MediConnect</a>
            <div>
                <a href="my-appointments.html" class="btn btn-outline-light btn-sm me-2">Appointments</a>
                <a href="notifications.html" class="btn btn-outline-light btn-sm me-2">Notifications</a>
                <a href="#" class="btn btn-light btn-sm" onclick="logout()">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h2>Doctor Dashboard</h2>
        <p class="text-muted">Welcome, Dr. <span id="docName"></span></p>

        <div class="row g-4 mb-4">
            <div class="col-md-3"><div class="stat-card text-center"><h3 id="pendingCount">0</h3><p>Pending</p></div></div>
            <div class="col-md-3"><div class="stat-card text-center"><h3 id="confirmedCount">0</h3><p>Confirmed</p></div></div>
            <div class="col-md-3"><div class="stat-card text-center"><h3 id="completedCount">0</h3><p>Completed</p></div></div>
            <div class="col-md-3"><div class="stat-card text-center"><h3 id="notifCount">0</h3><p>Unread</p></div></div>
        </div>

        <div class="card">
            <div class="card-header bg-primary text-white">Appointments</div>
            <div class="card-body"><div id="appointments">Loading...</div></div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        const userId = sessionStorage.getItem('user_id');
        if (!userId) window.location.href = 'login.html';
        let doctorId;

        async function load() {
            try {
                const doc = await api.getDoctorByUserId(userId);
                doctorId = doc.id;
                document.getElementById('docName').textContent = doc.firstName + ' ' + doc.lastName;
                const appts = await api.getAppointmentsByDoctor(doctorId);
                document.getElementById('pendingCount').textContent = appts.filter(a => a.status === 'PENDING').length;
                document.getElementById('confirmedCount').textContent = appts.filter(a => a.status === 'CONFIRMED').length;
                document.getElementById('completedCount').textContent = appts.filter(a => a.status === 'COMPLETED').length;

                const notifs = await api.getNotifications(userId);
                document.getElementById('notifCount').textContent = notifs.filter(n => !n.read).length;

                const c = document.getElementById('appointments');
                if (appts.length === 0) { c.innerHTML = '<p>No appointments</p>'; return; }
                c.innerHTML = appts.map(a => `
                    <div class="d-flex justify-content-between align-items-center border-bottom py-2">
                        <div>
                            <strong>Patient: ${a.patientName}</strong><br>
                            <small>${a.appointmentDate} ${a.appointmentTime} | ${a.status}</small>
                        </div>
                        <div>
                            ${a.status === 'PENDING' ? `<button class="btn btn-success btn-sm" onclick="confirm(${a.id})">Confirm</button>` : ''}
                            ${a.status === 'CONFIRMED' ? `<button class="btn btn-primary btn-sm" onclick="complete(${a.id})">Complete</button>` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }
        async function confirm(id) { await api.confirmAppointment(id); load(); }
        async function complete(id) { await api.completeAppointment(id); load(); }
        load();
        function logout() { api.clearToken(); window.location.href = 'index.html'; }
    </script>
</body>
</html>
