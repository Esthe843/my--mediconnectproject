<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Doctors - MediConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container"><a class="navbar-brand" href="index.html">MediConnect</a></div>
    </nav>

    <div class="container py-4">
        <h2>Find Doctors</h2>
        <div class="row mb-4">
            <div class="col-md-6">
                <input type="text" class="form-control" id="searchInput" placeholder="Search by name, specialization, hospital...">
            </div>
            <div class="col-md-3">
                <select class="form-select" id="specFilter">
                    <option value="">All Specializations</option>
                    <option value="GENERAL_PHYSICIAN">General Physician</option>
                    <option value="CARDIOLOGIST">Cardiologist</option>
                    <option value="DERMATOLOGIST">Dermatologist</option>
                    <option value="NEUROLOGIST">Neurologist</option>
                    <option value="PEDIATRICIAN">Pediatrician</option>
                    <option value="ORTHOPEDIC">Orthopedic</option>
                    <option value="GYNECOLOGIST">Gynecologist</option>
                    <option value="ENT_SPECIALIST">ENT Specialist</option>
                    <option value="DENTIST">Dentist</option>
                    <option value="PSYCHIATRIST">Psychiatrist</option>
                </select>
            </div>
            <div class="col-md-3">
                <button class="btn btn-primary" onclick="searchDoctors()">Search</button>
            </div>
        </div>
        <div class="row g-4" id="doctorList">Loading...</div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        async function loadDoctors() {
            try {
                const doctors = await api.getAvailableDoctors();
                renderDoctors(doctors);
            } catch (err) { console.error(err); }
        }
        async function searchDoctors() {
            const keyword = document.getElementById('searchInput').value;
            const spec = document.getElementById('specFilter').value;
            try {
                let doctors;
                if (keyword) doctors = await api.searchDoctors(keyword);
                else if (spec) doctors = await api.getDoctorsBySpecialization(spec);
                else doctors = await api.getAvailableDoctors();
                renderDoctors(doctors);
            } catch (err) { console.error(err); }
        }
        function renderDoctors(doctors) {
            const container = document.getElementById('doctorList');
            if (!doctors || doctors.length === 0) {
                container.innerHTML = '<p class="text-muted">No doctors found</p>';
                return;
            }
            container.innerHTML = doctors.map(d => `
                <div class="col-md-4">
                    <div class="card card-hover h-100">
                        <div class="card-body">
                            <h5>Dr. ${d.firstName} ${d.lastName}</h5>
                            <p class="text-primary">${d.specialization.replace(/_/g, ' ')}</p>
                            <p><small>${d.qualification} | ${d.experienceYears} yrs exp</small></p>
                            <p><small>${d.hospitalName || 'N/A'}</small></p>
                            <p><strong>Fee: $${d.consultationFee}</strong></p>
                            <span class="badge ${d.available ? 'bg-success' : 'bg-secondary'}">${d.available ? 'Available' : 'Unavailable'}</span>
                        </div>
                        <div class="card-footer">
                            <a href="book-appointment.html?doctorId=${d.id}" class="btn btn-primary btn-sm w-100">Book Appointment</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        loadDoctors();
    </script>
</body>
</html>
