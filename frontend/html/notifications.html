<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - MediConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container"><a class="navbar-brand" href="index.html">MediConnect</a></div>
    </nav>

    <div class="container py-4">
        <h2>Notifications</h2>
        <div id="notifList">Loading...</div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        const userId = sessionStorage.getItem('user_id');
        if (!userId) window.location.href = 'login.html';

        async function loadNotifs() {
            try {
                const notifs = await api.getNotifications(userId);
                const c = document.getElementById('notifList');
                if (notifs.length === 0) { c.innerHTML = '<p class="text-muted">No notifications</p>'; return; }
                c.innerHTML = notifs.map(n => `
                    <div class="card mb-2 ${n.read ? 'notification-read' : 'notification-unread'}">
                        <div class="card-body d-flex justify-content-between">
                            <div>
                                <strong>${n.title}</strong>
                                <p class="mb-0">${n.message}</p>
                                <small class="text-muted">${n.createdAt?.replace('T', ' ')}</small>
                            </div>
                            ${!n.read ? `<button class="btn btn-sm btn-outline-primary" onclick="markRead(${n.id})">Mark Read</button>` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }
        async function markRead(id) {
            await api.markNotificationRead(id);
            loadNotifs();
        }
        loadNotifs();
    </script>
</body>
</html>
