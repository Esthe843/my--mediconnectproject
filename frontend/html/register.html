<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MediConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container"><a class="navbar-brand" href="index.html">MediConnect</a></div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4">Create Account</h3>
                        <div id="alertBox" class="alert d-none"></div>
                        <form id="registerForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">First Name *</label>
                                    <input type="text" class="form-control" id="firstName" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Last Name *</label>
                                    <input type="text" class="form-control" id="lastName" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phone *</label>
                                <input type="tel" class="form-control" id="phone" placeholder="1234567890" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Role *</label>
                                <select class="form-select" id="role" required>
                                    <option value="">Select Role</option>
                                    <option value="ROLE_PATIENT">Patient</option>
                                    <option value="ROLE_DOCTOR">Doctor</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password * (min 8 chars)</label>
                                <input type="password" class="form-control" id="password" minlength="8" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Confirm Password *</label>
                                <input type="password" class="form-control" id="confirmPassword" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="submitBtn">Register</button>
                        </form>
                        <p class="text-center mt-3">Already have an account? <a href="login.html">Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        function showAlert(msg, type) {
            const box = document.getElementById('alertBox');
            box.className = `alert alert-${type}`;
            box.textContent = msg;
            box.classList.remove('d-none');
        }
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pw = document.getElementById('password').value;
            const cpw = document.getElementById('confirmPassword').value;
            if (pw !== cpw) { showAlert('Passwords do not match', 'danger'); return; }
            if (pw.length < 8) { showAlert('Password must be at least 8 characters', 'danger'); return; }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.textContent = 'Registering...';
            try {
                await api.register({
                    firstName: document.getElementById('firstName').value,
                    lastName: document.getElementById('lastName').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    password: pw,
                    confirmPassword: cpw,
                    role: document.getElementById('role').value
                });
                showAlert('Registration successful! Redirecting to login...', 'success');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } catch (err) {
                const msg = err.data?.message || err.data?.fieldErrors
                    ? Object.values(err.data.fieldErrors).join(', ') : 'Registration failed';
                showAlert(msg, 'danger');
                btn.disabled = false; btn.textContent = 'Register';
            }
        });
    </script>
</body>
</html>
