<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - MediConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container"><a class="navbar-brand" href="index.html">MediConnect</a></div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4">Book Appointment</h3>
                        <div id="alertBox" class="alert d-none"></div>
                        <form id="bookForm">
                            <div class="mb-3">
                                <label class="form-label">Doctor</label>
                                <input type="text" class="form-control" id="doctorName" readonly>
                                <input type="hidden" id="doctorId">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Date *</label>
                                <input type="date" class="form-control" id="appDate" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Time *</label>
                                <input type="time" class="form-control" id="appTime" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Type *</label>
                                <select class="form-select" id="appType" required>
                                    <option value="IN_PERSON">In Person</option>
                                    <option value="ONLINE">Online</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Reason</label>
                                <textarea class="form-control" id="reason" rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="submitBtn">Book Appointment</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const doctorId = params.get('doctorId');
        if (!doctorId) window.location.href = 'find-doctors.html';

        (async () => {
            try {
                const doc = await api.getDoctor(doctorId);
                document.getElementById('doctorName').value = `Dr. ${doc.firstName} ${doc.lastName} (${doc.specialization})`;
                document.getElementById('doctorId').value = doctorId;
            } catch (e) { console.error(e); }
        })();

        document.getElementById('bookForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            try {
                await api.bookAppointment({
                    patientId: parseInt(sessionStorage.getItem('user_id')),
                    doctorId: parseInt(doctorId),
                    appointmentDate: document.getElementById('appDate').value,
                    appointmentTime: document.getElementById('appTime').value + ':00',
                    appointmentType: document.getElementById('appType').value,
                    reason: document.getElementById('reason').value
                });
                document.getElementById('alertBox').className = 'alert alert-success';
                document.getElementById('alertBox').textContent = 'Appointment booked successfully!';
                document.getElementById('alertBox').classList.remove('d-none');
                setTimeout(() => window.location.href = 'my-appointments.html', 1500);
            } catch (err) {
                document.getElementById('alertBox').className = 'alert alert-danger';
                document.getElementById('alertBox').textContent = err.data?.message || 'Booking failed';
                document.getElementById('alertBox').classList.remove('d-none');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
